<style id="app-style">
/* Layout: phone-first read-only travel companion — app bar with logo and trip countdown, day strip, colored day hero, collapsible notes, vertical timeline with type nodes; cards spring open on tap */
:root{
  --bg:#F2F4F3; --surface:#FFFFFF; --surface2:#F7F9F8; --fg:#17201D; --muted:#5D6A65; --line:#E1E6E3; --chip:#EBEFED;
  --d1:#C2542D; --d2:#2F7A4F; --d3:#1B7A82; --d4:#4B4FA3; --d5:#2A68A6; --d6:#9A6B12; --prep:#56635E;
  --danger:#B3261E; --star:#A86F00; --ok:#2F7A4F; --ink:#FFFFFF;
  --f-display:"Black Han Sans","Noto Sans TC",system-ui,sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  --shadow:0 1px 2px rgba(20,30,26,.05),0 4px 14px rgba(20,30,26,.06);
  --day:var(--d1); --hk1:100%; --hk2:70%;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1312; --surface:#181D1C; --surface2:#1D2322; --fg:#E9EEEC; --muted:#9AA6A1; --line:#29312F; --chip:#232A28;
  --d1:#EE8a62; --d2:#73C08F; --d3:#57C0C8; --d4:#A2A6F2; --d5:#77ACE6; --d6:#E2B355; --prep:#9AA6A1;
  --danger:#FF8A80; --star:#F2C14E; --ok:#73C08F; --ink:#0F1312;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); --hk1:60%; --hk2:38%; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1312; --surface:#181D1C; --surface2:#1D2322; --fg:#E9EEEC; --muted:#9AA6A1; --line:#29312F; --chip:#232A28;
  --d1:#EE8a62; --d2:#73C08F; --d3:#57C0C8; --d4:#A2A6F2; --d5:#77ACE6; --d6:#E2B355; --prep:#9AA6A1;
  --danger:#FF8A80; --star:#F2C14E; --ok:#73C08F; --ink:#0F1312;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); --hk1:60%; --hk2:38%; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.6;margin:0;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--day)}
:focus-visible{outline:2.5px solid var(--day);outline-offset:2px;border-radius:8px}
.wrap{max-width:680px;margin:0 auto;padding-inline:16px}
svg.i{width:18px;height:18px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* app bar + day strip */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px 4px}
.bar h1{margin:0;font-size:17px;font-weight:900;letter-spacing:.01em;display:flex;align-items:center;gap:8px;min-width:0}

.bar h1 small{font-size:12px;font-weight:500;color:var(--muted);white-space:nowrap}
.trip{font-size:12px;font-weight:700;color:var(--day);background:color-mix(in srgb,var(--day) 12%,transparent);border-radius:999px;padding:3px 10px;white-space:nowrap}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-block:8px 10px;scrollbar-width:none;scroll-snap-type:x proximity}
.tabs::-webkit-scrollbar{display:none}
.tab{position:relative;flex:1 0 46px;scroll-snap-align:center;border:0;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);border-radius:14px;padding:6px 0 7px;min-width:0;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;transition:background .2s,color .2s,transform .15s}
.tab:active{transform:scale(.95)}
.tab b{font-family:var(--f-display);font-weight:400;font-size:21px}
.tab span{font-size:11px;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--tc);box-shadow:none;color:var(--ink)}
.tab[aria-selected="true"] span{color:var(--ink);opacity:.85}
.tab .now{position:absolute;top:-3px;right:-2px;font-size:9.5px;font-weight:900;background:var(--danger);color:#fff;border-radius:999px;padding:0 5px;line-height:1.6}

main{padding-bottom:calc(32px + env(safe-area-inset-bottom,0px))}
.stage{animation:fadeUp .28s ease both}
.stage.from-r{animation:slideR .28s ease both}
.stage.from-l{animation:slideL .28s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes slideR{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@keyframes slideL{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}

/* notices */
.notice{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border-radius:var(--r-md);box-shadow:var(--shadow);padding:12px 14px;margin-top:14px;font-size:13.5px;color:var(--muted)}
.notice svg{color:var(--day);margin-top:2px}
.notice .txt{flex:1;min-width:0}
.notice .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.notice button{border:0;background:none;color:var(--day);font-weight:700;font-size:13px;padding:6px 2px;min-height:32px}

/* hero */
.hero{position:relative;overflow:hidden;margin-top:14px;border-radius:var(--r-lg);padding:18px 18px 16px;color:#fff;background:#2E3633;background:linear-gradient(140deg,color-mix(in srgb,var(--day) var(--hk1),#000) 0%,color-mix(in srgb,var(--day) var(--hk2),#000) 100%);box-shadow:var(--shadow);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.hero .eyebrow{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.12em;opacity:.9}
.hero .eyebrow .tp{letter-spacing:0;background:rgba(255,255,255,.22);border-radius:999px;padding:1px 9px}
.hero .date{font-family:var(--f-display);font-size:58px;line-height:1;margin-top:8px}

</b></button><ul><li>抵達晚、帶行李，金浦 → 東大門住宿建議直接搭計程車（約 40–50 分）；省錢可搭地鐵 5 號線直達東大門歷史文化公園站。詳細步驟見「金浦機場 → 東大門住宿 交通教學」。</li></ul></div></div><section class="group"><div class="ghead"><h3>行程</h3><span class="cnt">4 項</span></div><ol class="tl rail"><li class="ti"><div class="ti-time"><b>19:45</b></div><div class="ti-node"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="14" rx="3"/><path d="M5 11h14M8 21l2-4M16 21l-2-4"/><circle cx="9" cy="14" r=".5"/><circle cx="15" cy="14" r=".5"/></svg></div><div class="card"><div class="row1"><div class="title"><span>抵達金浦機場國際線</span></div></div><div class="ko">김포공항 국제선</div><div class="detail"><p>入境、領行李預留約 60–90 分鐘。</p><div class="addr"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg><span>서울 강서구 하늘길 38</span></div><div class="acts"><a class="act nv" href="https://map.naver.com/p/entry/place/18952275" target="_blank" rel="noopener"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>NAVER 地圖</a></div></div></div></li><li class="ti"><div class="ti-time"><span>約</span><b>21:00</b></div><div class="ti-node"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="14" rx="3"/><path d="M5 11h14M8 21l2-4M16 21l-2-4"/><circle cx="9" cy="14" r=".5"/><circle cx="15" cy="14" r=".5"/></svg></div><div class="card"><div class="row1"><div class="title"><span>金浦機場 → 東大門住宿 交通教學</span></div></div><div class="sub">計程車（建議）或地鐵 5 號線</div><div class="ko">서울 중구 을지로41길 22</div><div class="detail"><p>建議：抵達晚又帶行李，直接搭計程車最省事；想省錢可搭地鐵 5 號線，一班車直達（方案 B）。

方案 A：計程車（約 40–50 分鐘）
1. 出關後在入境大廳跟著「Taxi 택시」標示，走到 1 樓門外的計程車招呼站排隊。
2. 搭一般計程車（橘色、白色、銀色）即可；黑色的是模範／大型計程車，起跳比較貴。
3. 上車後把手機上的韓文地址給司機看：「서울 중구 을지로41길 22」（也可以直接打開下方 NAVER 地圖給司機看）。
4. 確認司機有按下跳錶。
5. 車資估算約 ₩28,000–38,000（依路況、時段，以跳錶為準）：首爾一般計程車起跳 ₩4,800；22:00–23:00 加成 20%，23:00 後加成 40%。金浦機場在首爾市內，不用加跨市費。
6. 付款可刷信用卡或 T-money／WOWPASS，下車前說「카드요」（刷卡）。
7. 行李放後車廂，下車前確認行李都拿了。

方案 B：地鐵 5 號線直達（約 50 分鐘、約 ₩1,500–2,000）
1. 跟著「Subway 지하철」標示走到地鐵金浦機場站，用 T-money／WOWPASS 刷卡進站。
2. 搭 5 號線往「하남검단산 / 마천」方向（不要搭往「방화 傍花」）。

국집</div><div class="detail"><p>1986 年開到現在的老店，只賣北魚湯（明太魚湯）一種，進門直接比人數就好。

" style="--day:var(--prep)"><section class="hero prep"><div class="eyebrow">出發前</div><div class="date">準備</div><h2>出發前準備</h2></section><section class="group"><div class="ghead"><h3>出發前確認</h3><span class="cnt">3 項</span></div><ol class="tl"><li class="ti"><div class="card"><div class="row1"><div class="title"><span>☐ 填寫電子入境卡 e-Arrival Card</span><span class="badge">必填</span></div></div><div class="sub">10/23 晚上起</div><div class="sub">抵達前 3 天內填寫（韓國時間），免費</div><div class="detail"><p>時間：抵達前 3 天內（韓國時間），約 10/23 起，建議出發前 1–2 天填。
費用：免費，只認 www.e-arrivalcard.go.kr。
準備：護照、Email、航班號碼、10/26 抵達、10/31 離境、第一晚住宿英文地址。

官方 5 個步驟（官網中文是簡體字）：
1. 打開官網，選「个人申报」（一次可填 1–9 人）。STEP 1「同意条款」：勾選同意並輸入 Email，到信箱收驗證碼填回去（2026/5/6 起要驗證）。
2. STEP 2「输入护照信息」：可上傳護照照片自動辨識，辨識不準再手動改。英文姓名、護照號碼、效期、生日要逐字核對，國籍是 TAIWAN。
3. STEP 3「输入旅行信息」：抵達日期 10/26、航班號碼、離境日期 10/31、入境目的（觀光）、職業，以及韓國住宿地址。地址填第一晚完整英文地址「22 Eulji-ro 41-gil, Jung-gu, Seoul」，不要只寫 Seoul。
4. STEP 4「确认输入信息」：最常看錯的是航班日期、護照號碼、生日。
5. STEP 5「提交」：記下「签发编号」（申報號碼），存 PDF 或截圖；確認信也會寄到 Email。

小提醒：

card"><div class="row1"><div class="title"><span>填寫需要準備</span></div></div><div class="detail"><p>護照（英文姓名、護照號碼、效期要和護照一模一樣）、可收信的 Email（要收驗證碼）、航班號碼、抵達日期 10/26、離境日期 10/31、入境目的、職業、第一晚住宿英文地址「22 Eulji-ro 41-gil, Jung-gu, Seoul」。送出後記下签发编号，存 PDF 或截圖；航班變更到官網「查询·修改」更新。</p></div></div></li><li class="ti"><div class="card"><div class="row1"><div class="title"><span>小心假網站</span></div></div><div class="detail"><p>只認 .go.kr 結尾的官方網址，官方填寫免費；搜尋結果裡有收費代辦網站，不要點錯。</p></div></div></li><li class="ti"><div class="card"><div class="row1"><div class="title"><span>「台灣」欄位</span></div></div><div class="detail"><p>電子入境卡曾把出發地顯示成 CHINA（TAIWAN），外交部一度建議改填紙本；韓方 2026/4/10 改版後已刪除該欄位，國籍維持 TAIWAN。紙本入境卡是否仍提供各方說法不一，以電子入境卡為主，機上或機場有紙本也可以填。</p></div></div></li><li class="ti"><div class="card"><div class="row1"><div class="title"><span>Q-Code 檢疫申報</span></div></div><div class="detail"><p>從台灣直飛、身體沒有發燒咳嗽等症狀，不需要填；21 天內去過檢疫管理地區或有症狀才要申報。</p></div></div></li><li class="ti"><div class="card"><div class="row1"><div class="title"><span>海關申報</span></div></div><div class="detail"><p>超過 US$10,000 外幣、US$800 的物品、2 公升酒、60 ml 香水或 200 支菸才要申報；沒有就走綠色「無申報」通道，不用填表。</p></div></div></li><li class="ti"><div class="card"><div class="row1"><div class="title"><span>金浦機場入境流程</span></div></div><div class="detail"><p>下機 → 外國人通道查驗護照、按指紋、拍臉部照片 → 領行李 → 海關綠色通道 → 出關。整段預留 60–90 分鐘。</p></div></div></li></ol></section></div><div class="foot">第 26 版・離線閱讀版</div></main></noscript></div>

function ic(n,cls){return '<svg class="i'+(cls?' '+cls:'')+'" viewBox="0 0 24 24" aria-hidden="true">'+(IC[n]||IC.info)+'</svg>'}
function typeOf(it){
  var s=(it.name||'')+' '+(it.sub||'');
  if(/機場|AREX|計程車|起飛|報到|交通教學|搭/.test(s))return 'move';
  if(/入住|住宿|退房|飯店|Hotel/i.test(s))return 'stay';
  if(/咖啡|Coffee|카페|Cafe|Bake|烘焙|甜派/i.test(s))return 'cafe';
  if(/早餐|午餐|晚餐|食堂|冷麵|炸雞|湯|麵|Pasta|鍋|烤|釜飯|餃|海鮮|Mandu|Costes|House|串燒|韓定食/i.test(s))return 'food';
  if(/逛|Outlet|超市|購物|Store|MUSINSA|LV /i.test(s))return 'shop';
  return 'sight';
}

/* ---------- time (Seoul) ---------- */
function seoulNow(){var d=new Date(Date.now()+9*3600e3);return {y:d.getUTCFullYear(),m:d.getUTCMonth()+1,d:d.getUTCDate(),min:d.getUTCHours()*60+d.getUTCMinutes()}}
function pageDay(p){if(p.kind!=='day')return null;var a=p.date.split('/');return {m:+a[0],d:+a[1]}}
function isToday(p){var n=seoulNow(),pd=pageDay(p);return !!pd&&n.y===YEAR&&n.m===pd.m&&n.d===pd.d}
function todayPage(){for(var i=0;i<state.pages.length;i++)if(isToday(state.pages[i]))return state.pages[i];return null}
function parseTime(t){t=String(t||'');var m=t.match(/(\d{1,2}):(\d\d)(?:\s*[–\-~]\s*(\d{1,2}):(\d\d))?/);if(!m||/^\d{1,2}\//.test(t))return null;var s=+m[1]*60+ +m[2];return {s:s,e:m[3]?+m[3]*60+ +m[4]:s+45,a:m[1]+':'+m[2],b:m[3]?m[3]+':'+m[4]:'',pre:t.slice(0,m.index).trim()}}
function tripLabel(){
  var days=state.pages.filter(function(p){return p.kind==='day'});
  var n=seoulNow(), now=Date.UTC(n.y,n.m-1,n.d);
  var f=pageDay(days[0]), l=pageDay(days[days.length-1]);
  var start=Date.UTC(YEAR,f.m-1,f.d), end=Date.UTC(YEAR,l.m-1,l.d);
  if(now<start){var dd=Math.round((start-now)/864e5);return dd===1?'明天出發':'倒數 '+dd+' 天'}
  if(now>end)return '旅程結束';
  return 'DAY '+(Math.round((now-start)/864e5)+1)+' / '+days.length;
}

function recsHtml(it){
  if(!(it.recs||[]).length||!recsOpen[it.id])return '';
  return '<ul class="recs">'+it.recs.map(function(r){var u=safeUrl(r.naver);return '<li><div class="rt"><b>'+esc(r.name)+'</b>'+(r.note?'<span>'+esc(r.note)+'</span>':'')+'</div>'+(u?'<a href="'+esc(u)+'" target="_blank" rel="noopener" aria-label="'+esc(r.name)+' NAVER 地圖">'+ic('pin')+'</a>':'')+'</li>'}).join('')+'</ul>';
}
function itemHtml(it,g,ctx){

  var cls='ti'+(isDone(it)?' done':'')+(it.badge&&!g.check?' key':'')+(ctx.past&&ctx.past(t)?' past':'')+(ctx.now&&ctx.now(t)?' nowi':'')

  if(ctx.rail){
    h+='<div class="ti-time">'+(t?(t.pre?'<span>'+esc(t.pre)+'</span>':'')+'<b>'+t.a+'</b>'+(t.b?'<span>'+t.b+'</span>':''):'<em>'+esc(it.time||'')+'</em>')+'</div>';

  if(it.ko)h+='<div class="ko">'+esc(it.ko)+'</div>';

    if((it.recs||[]).length)acts+='<button class="act'+(recsOpen[it.id]?' on':'')+'" data-act="recs" data-id="'+it.id+'" aria-expanded="'+(!!recsOpen[it.id])+'">'+ic('shop')+'推薦店家（'+it.recs.length+'）</button>';

    if(acts)h+='<div class="acts">'+acts+'</div>';

function noteHtml(pid,kind,label,icon,arr){

var sw=null;

app.addEventListener('touchend',function(e){
  if(!sw)return;
  var t=e.changedTouches[0],dx=t.clientX-sw.x,dy=t.clientY-sw.y,dt=Date.now()-sw.t;sw=null;
  if(Math.abs(dx)>70&&Math.abs(dy)<45&&dt<700){
    var i=state.pages.indexOf(pageById(tab)), j=i+(dx<0?1:-1);
    if(j>=0&&j<state.pages.length)goTab(state.pages[j].id);
  }
},{passive:true});
app.addEventListener('touchcancel',function(){sw=null},{passive:true});

    setTimeout(function(){if(!hid)back()},1600); // 沒有切到新分頁時，自己收回
  },900);
}
addEventListener('pageshow',function(e){if(e.persisted&&undoFly)undoFly()});

app.addEventListener('click',function(e){
  var fa=e.target.closest('a[href]'),fk=fa&&fxKind(fa);
  if(fk&&!e.metaKey&&!e.ctrlKey&&!e.shiftKey&&!e.altKey&&e.button===0){launchFx(fa,e,fk);return}
  var t=e.target.closest('[data-tab]');
  if(t){goTab(t.dataset.tab);return}
  var a=e.target.closest('[data-act]');
  if(a){
    var act=a.dataset.act;
    if(act==='hint-off'){hintOff=true;saveUi();render()}
    else if(act==='recs'){recsOpen[a.dataset.id]=!recsOpen[a.dataset.id];pop='recs:'+a.dataset.id;patchItem(a.dataset.id)}
    else if(act==='note'){noteOpen[a.dataset.k]=!noteOpen[a.dataset.k];pop='note:'+a.dataset.k;patchNote(a.dataset.k)}
    else if(act==='grp'){groupOpen[a.dataset.g]=!groupOpen[a.dataset.g];pop='grp:'+a.dataset.g;render()}
    else if(act==='jump'){expanded[a.dataset.id]=true;pop='item:'+a.dataset.id;render();var el=app.querySelector('[data-tap="'+a.dataset.id+'"]');if(el)el.scrollIntoView({block:'center',behavior:'smooth'})}
    return;
  }
  var gh=e.target.closest('.ghead[data-g]');
  if(gh){groupOpen[gh.dataset.g]=!groupOpen[gh.dataset.g];pop='grp:'+gh.dataset.g;render();return}
  if(e.target.closest('a,input,.detail'))return;
  var it=e.target.closest('[data-tap]');
  if(it)toggleItem(it.dataset.tap);
});
app.addEventListener('change',function(e){
  var id=e.target.dataset&&e.target.dataset.chk;if(!id)return;
  done[id]=e.target.checked;lsSet(LS_DONE,done);render();
});
app.addEventListener('keydown',function(e){
  var el=e.target;
  if(el.dataset&&el.dataset.tap&&(e.key==='Enter'||e.key===' ')){e.preventDefault();toggleItem(el.dataset.tap);var n=app.querySelector('[data-tap="'+el.dataset.tap+'"]');if(n)n.focus()}
});
document.addEventListener('keydown',function(e){
  if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName||''))return;
  if(e.key==='ArrowRight'||e.key==='ArrowLeft'){var i=state.pages.indexOf(pageById(tab)),j=i+(e.key==='ArrowRight'?1:-1);if(j>=0&&j<state.pages.length)goTab(state.pages[j].id)}
});

render();window.__appOK=1;
setInterval(function(){if(document.visibilityState==='visible'&&isToday(pageById(tab)||{}))render()},60000);
})();
</script>

<script>if(!window.__appOK){var fb=document.getElementById('fallback');if(fb)document.getElementById('app').innerHTML=fb.textContent}</script>
<script>if('serviceWorker' in navigator){var hadSW=!!navigator.serviceWorker.controller,reloaded=false;navigator.serviceWorker.addEventListener('controllerchange',function(){if(hadSW&&!reloaded){reloaded=true;location.reload()}});navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(function(r){r.update()}).catch(function(e){console.error('sw',e)})}</script>
